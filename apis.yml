aid: kale
name: Kale
description: 'Kale (operated by Palette Technologies, Inc., dba Kale) is a creator-rewards
  and user-generated-content marketplace that connects social-media content creators
  with brands. Creators join brand challenges and tournaments, post authentic sponsored
  content about products they use, and earn cash, merchandise, and perks; brands source
  authentic UGC and micro-influencer marketing at scale. The platform is delivered
  through the getkale.com and kalecard.com web apps and native iOS/Android apps, with
  a merchant network spanning consumer brands such as Chili''s, Planet Fitness, Urban
  Outfitters, DoorDash, Southwest, and Starbucks. Kale is backed by Forerunner Ventures.
  No public developer/API surface is published; this profile captures the company''s
  public identity and security posture.'
